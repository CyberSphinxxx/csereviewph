<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReviewTayo dashboard v2: sidebar, plan, review, achievements, learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --mr:#8a1630;--mr2:#a81b3b;--wine:#2a0a12;--gold:#f6b93b;--ok:#12a150;--ok2:#0b7a3b;--bad:#9d1a33;
  --bg:#fdf8f6;--surf:#fff;--ink:#1b1216;--mute:#5a4a50;--blush:#fbeff0;--pill:#f6ecee;
  --line:rgba(138,22,48,.14);--mrt:#8a1630;--focus:#8a1630;--ringbg:#f3e1e4;--ringc:#8a1630;--chipbad:#fde3e6;--chipbadt:#9d1a33;
  color-scheme:light dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1a0c11;--surf:#2b1620;--ink:#f8ecef;--mute:#d6bcc3;--blush:#38192a;--pill:#3a1f29;--line:rgba(255,255,255,.16);--mrt:#ff9fb5;--focus:#ffd27a;--ringbg:rgba(255,255,255,.14);--ringc:#ff9fb5;--chipbad:#4a1a27;--chipbadt:#ffb3c2}
}
:root[data-theme="dark"]{--bg:#1a0c11;--surf:#2b1620;--ink:#f8ecef;--mute:#d6bcc3;--blush:#38192a;--pill:#3a1f29;--line:rgba(255,255,255,.16);--mrt:#ff9fb5;--focus:#ffd27a;--ringbg:rgba(255,255,255,.14);--ringc:#ff9fb5;--chipbad:#4a1a27;--chipbadt:#ffb3c2}

html{background:var(--bg);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0}
p{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== parts ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;border:0;font:700 15px Figtree,system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s,background .18s;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn-p{background:var(--mr);color:#fff;box-shadow:0 10px 24px -10px rgba(138,22,48,.75)}
.btn-p:hover{transform:translateY(-2px)}
.btn-gold{background:var(--gold);color:#2a0a12;box-shadow:0 10px 26px -12px rgba(246,185,59,.8)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-g:hover{background:var(--blush)}
.btn-sm{padding:9px 14px;font-size:13.5px;border-radius:12px}
.btn-danger{background:transparent;color:var(--chipbadt);box-shadow:inset 0 0 0 1.5px var(--chipbadt)}
.card{background:var(--surf);border-radius:24px;padding:22px;box-shadow:0 0 0 1.5px var(--line)}
.card>h3,.ch h3{font-size:21px}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch a,.lk{font:700 14px Figtree,sans-serif;color:var(--mrt);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.ch a:hover,.lk:hover{text-decoration:underline}
.mut{color:var(--mute);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--blush);color:var(--mrt);font:700 12.5px/1.3 Figtree,sans-serif;white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.gold{background:#fdeec6;color:#6b4300}
.chip.soon{background:var(--pill);color:var(--mute)}
.kpi-l{font:700 13px Figtree,sans-serif;opacity:.85}
.big{font:800 46px/.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em}
.ring{display:block;flex:none}
.rtxt{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:calc(50% - 14px);white-space:nowrap;font:800 22px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.rwrap{position:relative;display:inline-block}

/* owl */
.owl{display:block;width:100%;height:auto;overflow:visible}
.owl .eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.owl .pupil{transition:transform .12s ease-out}
.bob .owl{animation:bob 4.6s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;background:linear-gradient(180deg,#2c0b14,#1c060c);color:#f3dde2;display:flex;flex-direction:column;gap:16px;padding:20px 14px 16px;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px;font:400 24px Georgia,"Times New Roman",serif;color:#fff;text-decoration:none}
.brand .ow{width:30px;display:block}
.tgt{width:100%;text-align:left;border:0;cursor:pointer;background:rgba(255,255,255,.07);border-radius:18px;padding:13px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:inherit;transition:background .2s}
.tgt:hover{background:rgba(255,255,255,.12)}
.tgt small{display:block;font:700 12px Figtree,sans-serif;color:#e6bcc6}
.tgt b{display:block;font:800 18px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;color:#fff;margin:2px 0}
.tgt span{font:700 13px Figtree,sans-serif;color:var(--gold)}
.nav{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;border:0;background:none;color:#ecd2d8;font:700 15px Figtree,sans-serif;text-align:left;cursor:pointer;transition:background .2s,color .2s}
.nv .ic{width:20px;height:20px}
.nv:hover{background:rgba(255,255,255,.09);color:#fff}
.nv[aria-current=page]{background:#fff;color:var(--mr)}
.bdg{margin-left:auto;background:var(--gold);color:#2a0a12;border-radius:99px;padding:1px 9px;font:800 12px Figtree,sans-serif}
.sfoot{margin-top:auto;display:grid;gap:12px}
.gmini{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.gmini div{display:flex;justify-content:space-between;font:700 13px Figtree,sans-serif;color:#ecd2d8}
.gmini b{color:#fff}
.gbar{height:8px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--mr);color:#fff;display:grid;place-items:center;font:800 13px Figtree,sans-serif;box-shadow:0 0 0 2px rgba(255,255,255,.25);flex:none}
.user b{display:block;font-size:14px;color:#fff;line-height:1.2}
.user small{font-size:12px;color:#d6a9b4}

.mtop,.tabbar{display:none}
.main{padding:30px 40px 80px;max-width:1200px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:clamp(30px,3.4vw,44px)}
.top p{color:var(--mute);margin-top:6px;font-size:16px}
.top .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stk{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;background:#fdeec6;color:#6b4300;font:800 14px Figtree,sans-serif}
.stk .ic{width:17px;height:17px;stroke-width:2}

.note{display:none;margin:0 0 18px;max-width:700px;background:#1b1216;color:#fff;font:600 13.5px/1.45 Figtree,sans-serif;padding:10px 14px;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.note b{color:var(--gold)}
body.notes .note{display:block}
.lsw{display:inline-flex;align-items:center;gap:6px;margin:0 0 18px;padding:5px;border-radius:99px;background:#1b1216;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18);flex-wrap:wrap}
.lsw span{font:700 12.5px Figtree,sans-serif;padding:0 10px 0 12px;color:#e6c3cb}
.lsw button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:99px;font:700 13.5px Figtree,sans-serif;cursor:pointer}
.lsw button[aria-pressed=true]{background:var(--gold);color:#2a0a12}
.notes-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;border:0;border-radius:14px;padding:0 16px;min-height:44px;background:#1b1216;color:#fff;font:700 14px Figtree,sans-serif;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.18)}
.notes-btn[aria-pressed=true]{background:var(--gold);color:#2a0a12}

/* ===== dashboard pieces ===== */
.g-coach{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start}
.g-coach>.gc-side{grid-column:2;grid-row:1/span 3;display:grid;gap:18px;align-content:start}
.g-coach>:not(.gc-side){grid-column:1}
.col{display:grid;gap:18px;align-content:start;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.g-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
.g-2b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start;margin-top:18px}
.plan{position:relative;overflow:hidden}
.plan h2{font-size:30px;margin-bottom:4px}
.plan .po{position:absolute;right:20px;top:12px;width:78px}
.plan .prog{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
.pbar{flex:1;max-width:200px;height:8px;border-radius:9px;background:var(--pill);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--mr);border-radius:9px}
.steps{display:grid;gap:10px}
.stp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--blush)}
.stp .sn{width:34px;height:34px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font:800 15px Figtree,sans-serif;color:var(--mrt);box-shadow:0 0 0 1.5px var(--line)}
.stp b{display:block;font-size:16px;line-height:1.25}
.stp small{display:block;font-size:13.5px;color:var(--mute);margin-top:2px}
.stp.now{background:var(--mr);color:#fff;box-shadow:0 20px 36px -24px rgba(138,22,48,.9)}
.stp.now .sn{background:var(--gold);color:#2a0a12;box-shadow:none}
.stp.now small{color:#f3cbd3}
.cd{position:relative;overflow:hidden;background:linear-gradient(160deg,#8a1630,#65102a);color:#fff;border-radius:24px;padding:24px}
.cd .n{font:800 clamp(84px,9vw,112px)/.84 "Bricolage Grotesque",sans-serif;letter-spacing:-.06em;margin:12px 0 8px}
.cd b{display:block;font-size:17px}
.cd small{display:block;color:#f3cbd3;font-size:14px;margin-top:3px}
.cd .lk{color:var(--gold);margin-top:16px;display:inline-block}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sg h4{font:700 13px Figtree,sans-serif;letter-spacing:0;color:var(--mute);margin-bottom:8px}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--pill);box-shadow:inset 0 0 0 1.5px var(--line)}
.dots i.on{background:var(--gold);box-shadow:none}
.dots i.td{box-shadow:0 0 0 2px var(--mr);background:var(--surf)}
.rule{font-size:13px;color:var(--mute);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sj{display:grid;grid-template-columns:150px minmax(0,1fr) 44px 64px;gap:12px;align-items:center;padding:7px 0}
.sj .sn2{font-weight:700;font-size:14.5px;line-height:1.25}
.sbar{position:relative;height:12px;border-radius:9px;background:var(--pill)}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--mr);min-width:0}
.sbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.sj.weak .sbar i{background:var(--gold)}
.sj b{text-align:right;font-variant-numeric:tabular-nums}
.sj .btn{opacity:0;pointer-events:none}
.sj.weak .btn,.sj:hover .btn,.sj:focus-within .btn{opacity:1;pointer-events:auto}
@media (hover:none){.sj .btn{opacity:1;pointer-events:auto}}
.cq{container-type:inline-size}
@container (max-width:470px){.sj{grid-template-columns:minmax(0,1fr) 44px;grid-template-areas:"n p" "b b" "d d";gap:6px 12px;padding:9px 0}.sj .sn2{grid-area:n}.sj b{grid-area:p}.sj .sbar{grid-area:b}.sj .btn{grid-area:d;justify-self:start}.sj:not(.weak) .btn{display:none}.sj .btn{opacity:1;pointer-events:auto}}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ss{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--blush);flex-wrap:wrap}
.ss+.ss{margin-top:8px}
.ss .tt{flex:1 1 220px;min-width:0}
.ss b{display:block;font-size:14.5px;line-height:1.3}
.ss small{color:var(--mute);font-size:13px}
.sc{padding:4px 11px;border-radius:99px;font:800 12.5px Figtree,sans-serif;background:var(--chipbad);color:var(--chipbadt);white-space:nowrap}
.sc.good{background:#e4f7ec;color:#0a6b35}
.tile{border-radius:22px;padding:18px 20px;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surf);box-shadow:0 0 0 1.5px var(--line)}
.tile.mr{background:linear-gradient(160deg,#8a1630,#65102a);color:#fff;box-shadow:none}
.tile.gd{background:var(--gold);color:#2a0a12;box-shadow:none}
.tile .big{margin-top:6px}
.tile small{font-size:13px;opacity:.85}
.tile.mr small{color:#f3cbd3}
.next{display:flex;flex-direction:column;gap:10px}
.next h3{font-size:26px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:5px;overflow-x:auto;padding-bottom:4px}
.hm i{border-radius:4px;background:var(--pill)}
.hm i.a{background:#34c98a}
.hm i.c{background:var(--chipbad);box-shadow:inset 0 0 0 1.5px #e58a9a}
.hm i.t{box-shadow:0 0 0 2px var(--ink)}
.hm i.f{opacity:.35}
.hlegend{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.hlegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
/* countdown layout */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(160deg,#2c0b14,#1c060c);color:#fff;padding:30px 32px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center;margin-bottom:18px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at 12% 20%,rgba(150,26,58,.65),transparent 60%);pointer-events:none}
.hero>*{position:relative}
.hero .n{font:800 clamp(110px,15vw,190px)/.8 "Bricolage Grotesque",sans-serif;letter-spacing:-.07em}
.hero h2{font-size:clamp(24px,2.6vw,34px);margin-bottom:6px}
.hero p{color:#ecc9d0}
.weeks{display:grid;grid-template-columns:repeat(26,1fr);gap:4px;margin:18px 0 8px}
.weeks i{height:26px;border-radius:7px;background:rgba(255,255,255,.14)}
.weeks i:first-child{background:var(--gold)}
.weeks i:last-child{opacity:.55}
.hero .cap{font-size:14px;color:#ecc9d0}
.hero .pace{margin-top:14px;font:700 16px Figtree,sans-serif;color:#fff}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero .btn-g{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.hero .btn-g:hover{background:rgba(255,255,255,.12)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:10px;padding:24px}.weeks{grid-template-columns:repeat(13,1fr)}.weeks i{height:18px}}

/* ===== practice ===== */
.rec2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.rec{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:24px;text-align:left;border:0;cursor:pointer;transition:transform .2s;width:100%}
.rec:hover{transform:translateY(-3px)}
.rec.a{background:var(--mr);color:#fff;box-shadow:0 22px 40px -28px rgba(138,22,48,.9)}
.rec.b{background:var(--blush)}
.rec .ri{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.rec.b .ri{background:var(--surf);color:var(--mrt)}
.rec .ri .ic{width:26px;height:26px;stroke-width:2}
.rec small{display:block;font:700 12.5px Figtree,sans-serif;opacity:.85}
.rec b{display:block;font:800 21px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-top:3px}
.rec span.m{font-size:14px;opacity:.9;display:block;margin-top:3px}
.rec .go{margin-left:auto;width:22px;height:22px;flex:none}
.pf{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 4px}
.pf button{border:0;padding:8px 15px;border-radius:99px;background:var(--surf);box-shadow:inset 0 0 0 1.5px var(--line);font:700 14px Figtree,sans-serif;cursor:pointer;transition:background .2s}
.pf button small{opacity:.65;margin-left:4px;font-weight:700}
.pf button:hover{background:var(--blush)}
.pf button[aria-pressed=true]{background:var(--mr);color:#fff;box-shadow:none}
.gh{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.gh h3{font-size:24px}
.gh span{color:var(--mute);font-size:14.5px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:22px;background:var(--surf);box-shadow:0 0 0 1.5px var(--line);border:0;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:pop .35s both;animation-delay:calc(var(--i,0)*30ms);min-height:172px}
.mode:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--mr),0 22px 34px -26px rgba(90,15,35,.6)}
.mode .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mi{width:44px;height:44px;border-radius:14px;background:var(--bgc);color:var(--fgc);display:grid;place-items:center}
.mi .ic{width:22px;height:22px;stroke-width:2}
.mode h4{font-size:19px;line-height:1.1;margin-top:4px}
.mode p{font-size:14px;color:var(--mute)}
.mode .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.mode.soon{cursor:default;background:transparent;box-shadow:inset 0 0 0 2px var(--line);opacity:.8}
.mode.soon:hover{transform:none;box-shadow:inset 0 0 0 2px var(--line)}
.fam-test{--bgc:#8a1630;--fgc:#fff}
.fam-review{--bgc:#fdeec6;--fgc:#6b4300}
.fam-focus{--bgc:#dce6f8;--fgc:#1f3a6e}
.fam-mem{--bgc:#d7efe0;--fgc:#14532d}
.fam-chal{--bgc:#e6dcf7;--fgc:#45276f}

/* sheet */
.back{position:fixed;inset:0;background:rgba(20,5,10,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surf);z-index:95;transform:translateX(102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.open{transform:none;box-shadow:-30px 0 60px -30px rgba(0,0,0,.5)}
.sh-h{display:flex;align-items:center;gap:14px;padding:22px 22px 16px}
.sh-h h3{font-size:26px}
.sh-x{margin-left:auto;border:0;background:var(--pill);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.sh-b{padding:0 22px 16px;overflow:auto;flex:1;display:grid;gap:18px;align-content:start}
.sh-b h5{font:800 14px Figtree,sans-serif;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{border:0;padding:8px 14px;border-radius:99px;background:var(--pill);font:700 14px Figtree,sans-serif;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--mr);color:#fff}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{border:0;text-align:left;padding:12px 14px;border-radius:16px;background:var(--pill);cursor:pointer;box-shadow:inset 0 0 0 2px transparent}
.seg2 button b{display:block;font-size:14.5px}
.seg2 button small{font-size:12.5px;color:var(--mute)}
.seg2 button[aria-pressed=true]{background:var(--blush);box-shadow:inset 0 0 0 2px var(--mr)}
.info{background:var(--blush);border-radius:14px;padding:12px 14px;font-size:14px}
.sh-f{padding:16px 22px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.sh-f .sum{font-weight:700;font-size:14.5px}
.sh-f .btn{width:100%;padding:14px}
.sh-f .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.sw{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;cursor:pointer;position:relative}
.sw input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.sw-t{width:44px;height:26px;border-radius:99px;background:var(--pill);box-shadow:inset 0 0 0 1.5px var(--line);position:relative;transition:background .2s;flex:none}
.sw-t::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surf);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+.sw-t{background:var(--mr)}
.sw input:checked+.sw-t::after{transform:translateX(18px)}
.sw input:focus-visible+.sw-t{outline:3px solid var(--focus);outline-offset:3px}

/* ===== history ===== */
.chart{width:100%;height:auto;display:block}
.chart text{font:600 12px Figtree,sans-serif;fill:var(--mute)}
.fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.fchips button{border:0;padding:7px 14px;border-radius:99px;background:var(--pill);font:700 13.5px Figtree,sans-serif;cursor:pointer}
.fchips button[aria-pressed=true]{background:var(--mr);color:#fff}

/* ===== notes ===== */
.nt{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.nsearch{display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:14px;padding:0 12px;margin:12px 0}
.nsearch input{flex:1;border:0;outline:0;background:none;padding:12px 0;font:600 15px Figtree,sans-serif;min-width:0}
.nsearch:focus-within{box-shadow:0 0 0 2px var(--mr)}
.nsearch .ic{width:18px;height:18px;color:var(--mute)}
.ni{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:16px;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);margin-top:8px;transition:background .2s}
.ni:hover{background:var(--blush)}
.ni[aria-current=true]{background:var(--blush);box-shadow:inset 0 0 0 2px var(--mr)}
.ni b{display:flex;gap:6px;align-items:center;font-size:15px;line-height:1.25}
.ni b .ic{width:14px;height:14px;color:var(--gold);fill:var(--gold)}
.ni small{display:block;color:var(--mute);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed{display:grid;gap:14px}
.ed input.ti{border:0;outline:0;background:none;font:800 28px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;width:100%;padding:0}
.ed textarea{width:100%;min-height:280px;border:0;outline:0;background:var(--blush);border-radius:18px;padding:16px;font:500 16px/1.6 Figtree,sans-serif;resize:vertical}
.ed textarea:focus{box-shadow:0 0 0 2px var(--mr)}
.ed select{border:0;background:var(--pill);padding:9px 12px;border-radius:12px;font:700 14px Figtree,sans-serif}
.edbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.edbar .sp{margin-left:auto}
.saved{font-size:13px;color:var(--ok2);font-weight:700}

/* ===== settings ===== */
.set{display:grid;gap:16px;max-width:840px}
.set h3{margin-bottom:4px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rw:first-of-type{border-top:0}
.rw b{display:block;font-size:15px}
.rw small{color:var(--mute);font-size:13.5px}
.step{display:inline-flex;align-items:center;gap:0;background:var(--pill);border-radius:14px;overflow:hidden}
.step button{border:0;background:none;width:42px;height:42px;font:800 20px Figtree,sans-serif;cursor:pointer}
.step button:hover{background:var(--blush)}
.step output{min-width:52px;text-align:center;font:800 18px Figtree,sans-serif}
.rw input[type=date],.rw input[type=time]{border:0;background:var(--pill);padding:10px 12px;border-radius:12px;font:700 14.5px Figtree,sans-serif}
.seg3{display:inline-flex;background:var(--pill);border-radius:14px;padding:4px}
.seg3 button{border:0;background:none;padding:8px 16px;border-radius:11px;font:700 14px Figtree,sans-serif;cursor:pointer}
.seg3 button[aria-pressed=true]{background:var(--mr);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1b1216;color:#fff;padding:12px 18px;border-radius:14px;font:700 14px Figtree,sans-serif;z-index:120;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== v2 additions ===== */
.ng{font:700 12.5px Figtree,sans-serif;color:#c99aa6;padding:0 14px;margin:12px 0 4px}
.navwrap{display:grid}
.nv .nw{display:none;margin-left:auto;background:var(--gold);color:#2a0a12;border-radius:99px;padding:0 8px;font:800 10.5px/17px Figtree,sans-serif}
body.notes .nv .nw{display:inline-block}
.nv .bdg+.nw{margin-left:6px}
.soonl{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.28);background:none;color:#ecd2d8;font:700 14px Figtree,sans-serif;cursor:pointer;text-align:left}
.soonl:hover{background:rgba(255,255,255,.07);color:#fff}
.soonl .ic{width:18px;height:18px}
.g-eq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.hero .ho{position:absolute;right:24px;top:16px;width:74px}
/* study plan */
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.wd{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:20px;background:var(--surf);box-shadow:0 0 0 1.5px var(--line);min-height:196px}
.wd small{font:700 12.5px Figtree,sans-serif;color:var(--mute)}
.wd .dn{font:800 30px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.wd h4{font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.wd .ft{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.wd.today{background:var(--mr);color:#fff;box-shadow:0 20px 34px -24px rgba(138,22,48,.9)}
.wd.today small{color:#f3cbd3}
.wd.done{background:var(--blush)}
.wd.today .chip{background:rgba(255,255,255,.18);color:#fff}
.chip.ok{background:#e4f7ec;color:#0a6b35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font:700 12.5px Figtree,sans-serif;color:var(--mute);padding:6px 0}
.dy{height:42px;display:grid;place-items:center;border-radius:12px;font:600 14.5px Figtree,sans-serif;position:relative}
.dy.ans::after,.dy.chk::after{content:"";position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;background:#34c98a}
.dy.chk::after{background:#e58a9a}
.dy.tod{box-shadow:inset 0 0 0 2px var(--mr);font-weight:800}
.dy.exam{background:var(--mr);color:#fff;font-weight:800}
.dy.pst{opacity:.4}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh h3{font-size:22px}
.calh div{display:flex;gap:6px}
.calh button{width:36px;height:36px;border-radius:50%;border:0;background:var(--pill);cursor:pointer;display:grid;place-items:center}
.calh button[disabled]{opacity:.35;cursor:not-allowed}
.calh button .ic{width:16px;height:16px}
.ms{display:grid}
.mi2{display:grid;grid-template-columns:auto 1fr;gap:14px;padding-bottom:18px;position:relative}
.mi2:last-child{padding-bottom:0}
.mi2::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.mi2:last-child::before{display:none}
.mi2 .mk{width:28px;height:28px;border-radius:50%;background:var(--pill);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
.mi2.done .mk{background:#34c98a;box-shadow:none;color:#fff}
.mi2 .mk .ic{width:14px;height:14px;stroke-width:3}
.mi2 b{display:block;font-size:15px;line-height:1.3}
.mi2 small{color:var(--mute);font-size:13.5px}
/* review */
.rvh{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:linear-gradient(160deg,#8a1630,#65102a);color:#fff;border-radius:26px;padding:24px 28px;margin-bottom:18px}
.rvh .n{font:800 76px/.85 "Bricolage Grotesque",sans-serif;letter-spacing:-.05em}
.rvh b{display:block;font-size:19px}
.rvh p{color:#f3cbd3;max-width:46ch;margin-top:4px;font-size:15px}
.rvh .btn{margin-left:auto}
.qi{display:grid;gap:10px;padding:16px 18px;border-radius:20px;background:var(--surf);box-shadow:0 0 0 1.5px var(--line)}
.qi+.qi{margin-top:10px}
.qi p{font-weight:600;font-size:16px}
.qi .mt2,.qi .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rtabs{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.empty{text-align:center;padding:40px 20px}
.empty .bob{width:88px;margin:0 auto 10px}
.empty p{color:var(--mute);margin:6px 0 0}
/* achievements */
.bgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bd{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:22px;background:var(--surf);box-shadow:0 0 0 1.5px var(--line)}
.bd .bi{width:52px;height:52px;border-radius:16px;background:var(--pill);color:var(--mute);display:grid;place-items:center}
.bd .bi .ic{width:26px;height:26px;stroke-width:2}
.bd.on .bi{background:var(--gold);color:#2a0a12}
.bd h4{font-size:18px}
.bd p{font-size:14px;color:var(--mute)}
.bd .pbar{max-width:none;margin-top:auto}
.bd small{font:700 12.5px Figtree,sans-serif;color:var(--mute)}
.nxt{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px;background:var(--gold);color:#2a0a12;border-radius:24px;padding:20px 24px}
.nxt b{display:block;font:800 22px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.nxt .pbar{background:rgba(0,0,0,.14);max-width:260px;margin-top:8px}
.nxt .pbar i{background:#2a0a12}
/* learn */
.lrn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lc{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:22px;background:var(--surf);box-shadow:0 0 0 1.5px var(--line);border:0;cursor:pointer;transition:transform .2s,box-shadow .2s;min-height:170px}
.lc:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--mr),0 22px 34px -26px rgba(90,15,35,.6)}
.lc .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lc h4{font-size:20px;margin-top:4px}
.lc p{font-size:14px;color:var(--mute)}
/* coming soon + more sheets */
.sn{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;border-radius:18px;background:var(--blush)}
.sn b{display:block;font-size:16px}
.sn p{font-size:14px;color:var(--mute);margin-top:2px}
.mm{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:16px;background:var(--pill);font:700 16px Figtree,sans-serif;text-align:left;cursor:pointer}
.mm .ic{width:22px;height:22px;color:var(--mrt)}
.mm+.mm{margin-top:8px}
@media (max-width:1080px){.bgs{grid-template-columns:repeat(2,minmax(0,1fr))}.lrn{grid-template-columns:repeat(2,minmax(0,1fr))}.g-eq{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.lrn{grid-template-columns:minmax(0,1fr)}.rvh .btn{margin-left:0;width:100%}.hero .ho{display:none}.wk{grid-template-columns:minmax(0,1fr)}.wd{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.wd .ft{margin-top:0;flex-direction:row;align-items:center;flex-wrap:wrap;width:100%}.wd h4{flex:1 1 60%}}

/* ===== responsive ===== */
@media (max-width:1080px){
  .g-coach,.g-2,.g-2b{grid-template-columns:minmax(0,1fr)}
  .g-coach>.gc-side,.g-coach>:not(.gc-side){grid-column:1;grid-row:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:1fr 1fr}
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(180deg,#2c0b14,#1c060c);color:#fff}
  .mtop .brand{padding:0}
  .main{padding:22px 20px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:#1c060c;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -12px rgba(0,0,0,.5)}
  .tabbar button{border:0;background:none;color:#e6bcc6;display:grid;justify-items:center;gap:3px;padding:6px 2px;font:700 11px Figtree,sans-serif;border-radius:12px;position:relative}
  .tabbar button .ic{width:22px;height:22px}
  .tabbar button[aria-current=page]{color:#fff;background:rgba(255,255,255,.14)}
  .tabbar .dotb{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .nt{grid-template-columns:minmax(0,1fr)}
  .top .stk{display:none}
  .top .act{width:100%}
  .top .act .btn{width:100%;padding:14px}
  .notes-btn{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  .rec2{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
  .mode{min-height:0}
  .g-3{grid-template-columns:1fr}
  .sj{grid-template-columns:minmax(0,1fr) 44px;grid-template-areas:"n p" "b b" "d d"}
  .sj .sn2{grid-area:n}.sj b{grid-area:p}.sj .sbar{grid-area:b}.sj .btn{grid-area:d;justify-self:start}
  .sj .btn{opacity:1;pointer-events:auto}
  .sj:not(.weak) .btn{display:none}
  .stp{grid-template-columns:auto minmax(0,1fr)}
  .stp .btn{grid-column:1/-1;justify-content:center}
  .plan .po{display:none}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Main"></aside>
  <div>
    <header class="mtop"><a class="brand" href="#"><span class="ow" data-owl></span>reviewtayo</a><span class="stk" id="mStk"></span></header>
    <main class="main" id="main">
      <div class="top" id="top"></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="back" id="back"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" inert></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="notes-btn" id="notesbtn" type="button" aria-pressed="false">Design notes: off</button>

<script>
/* ---------- owl (simplified stand-in) ---------- */
function eye(cx,tr){return '<g class="eye"><circle cx="'+cx+'" cy="94" r="26" fill="#fff" stroke="#F8DDE2" stroke-width="4"/><g'+(tr?' class="pupil"':'')+'><circle cx="'+cx+'" cy="94" r="12" fill="#1B0A10"/><circle cx="'+(cx+4)+'" cy="89" r="4" fill="#fff"/></g></g>'}
function owl(cap){
  return '<svg class="owl" viewBox="0 0 200 236" role="img" aria-label="ReviewTayo owl">'+
  '<rect x="66" y="208" width="30" height="14" rx="7" fill="#F6B93B"/><rect x="104" y="208" width="30" height="14" rx="7" fill="#F6B93B"/>'+
  '<path d="M100 34C152 34 180 74 180 132C180 188 150 214 100 214C50 214 20 188 20 132C20 74 48 34 100 34Z" fill="#8A1630"/>'+
  '<path d="M34 56L54 18L88 44Z" fill="#6B0F25"/><path d="M166 56L146 18L112 44Z" fill="#6B0F25"/>'+
  '<path d="M22 118C2 150 10 192 44 200C42 172 38 146 22 118Z" fill="#6B0F25"/><path d="M178 118C198 150 190 192 156 200C158 172 162 146 178 118Z" fill="#6B0F25"/>'+
  '<ellipse cx="100" cy="162" rx="48" ry="50" fill="#F8DDE2"/>'+
  '<path d="M74 142q13 11 26 0q13 11 26 0M70 166q15 11 30 0q15 11 30 0M78 190q11 9 22 0q11 9 22 0" fill="none" stroke="#DDA3AF" stroke-width="3.5" stroke-linecap="round"/>'+
  '<ellipse cx="100" cy="94" rx="68" ry="48" fill="#A81B3B"/>'+
  (cap?'<g><path d="M60 34L100 14L140 34L100 54Z" fill="#221219"/><path d="M80 44V58Q100 68 120 58V44" fill="#33202A"/><path d="M140 34V58" stroke="#F6B93B" stroke-width="3.5" stroke-linecap="round"/><circle cx="140" cy="61" r="5" fill="#F6B93B"/></g>':'')+
  eye(74,1)+eye(126,1)+'<path d="M91 108L109 108L100 127Z" fill="#F6B93B" stroke="#F6B93B" stroke-width="4" stroke-linejoin="round"/></svg>';
}
function initOwls(root){(root||document).querySelectorAll('[data-owl]:not([data-done])').forEach(n=>{n.setAttribute('data-done','1');n.innerHTML=owl(n.hasAttribute('data-cap'))})}

/* ---------- icons ---------- */
const P={
 dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
 practice:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
 notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h6"/>',
 settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 flame:'<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
 bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
 repeat:'<path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/>',
 bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 cards:'<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M7 4h10"/>',

/* ---------- study plan ---------- */
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const isoOf=t=>new Date(t).toISOString().slice(0,10);
function weekCards(){
  const order=D.subj.map((s,i)=>({n:s.n,p:s.p,i})).sort((a,b)=>a.p-b.p||a.i-b.i);
  const sun=TODAY-new Date(TODAY).getUTCDay()*864e5;
  const plan=['Quick diagnostic test','Spaced review + '+order[0].n,order[1].n+' drill',order[2].n+' drill',order[3].n+' drill',order[4].n+' drill','Medium assessment'];
  let h='';
  for(let k=0;k<7;k++){const t=sun+k*864e5,iso=isoOf(t),st=t<TODAY?(D.answered.includes(iso)?'done':'miss'):t===TODAY?'today':'next';
    h+='<div class="wd '+st+'"><small>'+DAYN[k]+'</small><span class="dn">'+new Date(t).getUTCDate()+'</span><h4>'+plan[k]+'</h4><div class="ft">'+
     (st==='done'?'<span class="chip ok">'+ic('check')+'Done</span>':st==='today'?'<span class="chip">'+S.dailyDone+' / '+S.goal+' items</span><button class="btn btn-gold btn-sm" type="button" data-act="open" data-m="srs">Start</button>':'<span class="chip">'+(k===6?'30':S.goal)+' items</span>')+'</div></div>'}
  return '<div class="wk">'+h+'</div>'}
function calCard(){
  const cur=new Date(TODAY),ex=new Date(Date.parse(S.date+'T00:00:00Z')),min=cur.getUTCFullYear()*12+cur.getUTCMonth(),max=Math.max(min,ex.getUTCFullYear()*12+ex.getUTCMonth());
  S.cal=Math.min(max,Math.max(min,S.cal));
  const y=Math.floor(S.cal/12),m=S.cal%12,pad=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  let cells=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>'<span class="h">'+d+'</span>').join('')+Array(pad).fill('<span></span>').join('');
  for(let d=1;d<=dim;d++){const t=Date.UTC(y,m,d),iso=isoOf(t);let c='dy';
    if(iso===S.date)c+=' exam';else if(t===TODAY)c+=' tod';
    if(D.answered.includes(iso))c+=' ans';else if(D.checkin.includes(iso))c+=' chk';else if(t<TODAY)c+=' pst';
    cells+='<span class="'+c+'" title="'+(iso===S.date?'Exam day':'')+'">'+d+'</span>'}
  return '<section class="card"><div class="calh"><h3>'+MONTHS[m]+' '+y+'</h3><div><button type="button" data-cal="-1" aria-label="Previous month"'+(S.cal<=min?' disabled':'')+'>'+ic('chevL')+'</button><button type="button" data-cal="1" aria-label="Next month"'+(S.cal>=max?' disabled':'')+'>'+ic('chevR')+'</button></div></div><div class="cal">'+cells+'</div>'+
   '<div class="hlegend"><span><i style="background:var(--mr)"></i>Exam day</span><span><i style="background:#34c98a;border-radius:50%"></i>Studied</span><span><i style="box-shadow:inset 0 0 0 2px var(--mr)"></i>Today</span></div></section>'}
function milestoneCard(){
  const ex=Date.parse(S.date+'T00:00:00Z'),cap=t=>Math.min(t,ex-14*864e5),add=w=>isoOf(cap(TODAY+w*7*864e5));
  const L=[{t:'Take a diagnostic test',d:'Done on Sep 20, 2026',done:1},{t:'Finish your first full mock',d:'Suggested by '+fmtDate(add(4))},{t:'Every subject above 50%',d:'Suggested by '+fmtDate(add(12))},{t:'Every subject at your '+D.target+'% target',d:'Suggested by '+fmtDate(isoOf(ex-14*864e5))},{t:'Rest and light review',d:'The last 3 days before '+fmtDate(S.date)}];
  return '<section class="card"><div class="ch"><h3>Milestones</h3></div><div class="ms">'+L.map(x=>'<div class="mi2'+(x.done?' done':'')+'"><span class="mk">'+(x.done?ic('check'):'')+'</span><div><b>'+x.t+'</b><small>'+x.d+'</small></div></div>').join('')+'</div></section>'}
function planView(){
  const d=daysLeft();
  return '<p class="note"><b>Study plan.</b> Turns the countdown into a path. The week is built from your weakest subjects first, and the milestones are suggestions based on your exam date. The calendar from the old dashboard lives here now.</p>'+
   '<section class="card" style="margin-bottom:18px"><div class="ch"><h3>This week</h3><span class="mut">'+d+' days to '+esc(S.exam)+'</span></div>'+weekCards()+'</section>'+
   '<div class="g-2b">'+calCard()+milestoneCard()+'</div>'}

  if(c.fb)b+='<div><h5>How do you want feedback?</h5><div class="seg2" role="group" aria-label="Feedback"><button type="button" data-fb="study" aria-pressed="'+(SH.fb==='study')+'"><b>Study mode</b><small>Explanation after each answer</small></button><button type="button" data-fb="exam" aria-pressed="'+(SH.fb==='exam')+'"><b>Exam mode</b><small>Answers at the end</small></button></div></div>';
  if(c.tm)b+='<div class="rw" style="border:0;padding:0"><div><b>Timer</b><small>Track how long you take</small></div><label class="sw"><input type="checkbox" id="shTm"'+(SH.tm?' checked':'')+' aria-label="Timer"><span class="sw-t"></span></label></div>';
  if(c.lock)b+='<p class="info">'+c.lock+'</p>';
  if(c.empty)b+='<p class="info">'+c.empty+'</p>';
  const sum=c.sum({sub:SH.sub,items:SH.items});
  $('sheet').innerHTML='<div class="sh-h"><span class="mi fam-'+m.g+'">'+ic(m.ic)+'</span><h3 id="shT">'+m.t+'</h3><button class="sh-x" type="button" id="shX" aria-label="Close">'+ic('close')+'</button></div><div class="sh-b"><p class="mut">'+m.d+'</p>'+b+'</div><div class="sh-f"><p class="sum">'+sum+'</p><button class="btn btn-p" type="button" id="shGo"'+(c.empty?' disabled':'')+'>Start '+ic('arrow')+'</button></div>';
  const x=$('sheet').querySelector('#shX');x.classList.add('sh-x');
}
$('sheet').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#shX')){closeSheet();return}
  const s=t.closest('[data-sub]');if(s){SH.sub=s.dataset.sub;drawSheet();return}
  const i=t.closest('[data-items]');if(i){SH.items=+i.dataset.items;drawSheet();return}
  const f=t.closest('[data-fb]');if(f){SH.fb=f.dataset.fb;drawSheet();return}
  if(t.closest('#shGo')){const m=SH.m,c=CFG[m.id];toast('Mock: would start “'+m.t+'” · '+c.sum({sub:SH.sub,items:SH.items}));closeSheet()}
});
$('sheet').addEventListener('change',e=>{if(e.target.id==='shTm')SH.tm=e.target.checked});
$('back').addEventListener('click',closeSheet);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href="#"]');if(a)e.preventDefault();
  const v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}
  const act=e.target.closest('[data-act]');
  if(act){
    const k=act.dataset.act;
    if(k==='quick')openSheet('quick');
    else if(k==='open')openSheet(act.dataset.m);
    else if(k==='drill')openSheet('topic',D.subj[+act.dataset.s].n);
    else if(k==='toast')toast(act.dataset.m);
    else if(k==='soon')openSoon();
    else if(k==='more')openMore();
    else if(k==='q2note'){const q=QS.find(x=>x.id===+act.dataset.q);NOTES.unshift({id:nid,t:'Review: '+q.s,s:q.s,b:q.q,pin:0});S.noteId=nid++;toast('Saved to Notes')}
    else if(k==='newnote'){NOTES.unshift({id:nid,t:'',s:'General',b:'',pin:0});S.noteId=nid++;S.noteQ='';go('notes');setTimeout(()=>{const t=$('nTitle');if(t)t.focus()},30)}
    else if(k==='pin'){const n=NOTES.find(x=>x.id===S.noteId);n.pin=n.pin?0:1;$('nList').innerHTML=noteList();$('nEd').innerHTML=noteEditor()}
    else if(k==='delnote'){NOTES=NOTES.filter(x=>x.id!==S.noteId);S.noteId=NOTES.length?NOTES[0].id:0;$('nList').innerHTML=noteList();$('nEd').innerHTML=noteEditor();initOwls($('nEd'));toast('Note deleted')}
    return;
  }
  const cal=e.target.closest('[data-cal]');if(cal){S.cal+=+cal.dataset.cal;render();return}
  const rt=e.target.closest('[data-rt]');if(rt){S.rt=rt.dataset.rt;render();return}
  const rs=e.target.closest('[data-rs]');if(rs){S.rs=rs.dataset.rs;render();return}
  const pf=e.target.closest('[data-pf]');if(pf){S.pf=pf.dataset.pf;render();return}
  const hf=e.target.closest('[data-hf]');if(hf){S.histF=hf.dataset.hf;render();return}
  const n=e.target.closest('[data-note]');if(n){S.noteId=+n.dataset.note;$('nList').innerHTML=noteList();$('nEd').innerHTML=noteEditor();return}
  const st=e.target.closest('[data-step]');if(st){S.goal=Math.max(5,Math.min(200,S.goal+ +st.dataset.step));$('goalOut').textContent=S.goal;renderSide();return}
  const th=e.target.closest('[data-theme]');if(th){S.theme=th.dataset.theme;if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nSearch'){S.noteQ=t.value;$('nList').innerHTML=noteList();return}
  const n=NOTES.find(x=>x.id===S.noteId);
  if(t.id==='nTitle'&&n){n.t=t.value;$('nList').innerHTML=noteList()}
  else if(t.id==='nBody'&&n){n.b=t.value;$('nList').innerHTML=noteList()}
});
document.addEventListener('change',e=>{
  const t=e.target,n=NOTES.find(x=>x.id===S.noteId);
  if(t.id==='nSub'&&n){n.s=t.value;$('nList').innerHTML=noteList();return}
  const k=t.dataset&&t.dataset.set;if(!k)return;
  if(k==='date'){if(t.value){S.date=t.value;$('dateSm').textContent=daysLeft()+' days from today';renderSide()}}
  else if(k==='exam'){S.exam=t.value;renderSide()}
  else if(k==='remTime')S.remTime=t.value;
  else S[k]=t.checked;
});
$('notesbtn').addEventListener('click',()=>{const on=document.body.classList.toggle('notes');$('notesbtn').setAttribute('aria-pressed',on);$('notesbtn').textContent='Design notes: '+(on?'on':'off')});

render();initOwls();
let pq=false;
addEventListener('pointermove',e=>{if(pq)return;pq=true;requestAnimationFrame(()=>{pq=false;
  document.querySelectorAll('.pupil').forEach(p=>{
    const r=p.ownerSVGElement.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight||!r.width)return;
    const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height*.4),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/280)*6;
    p.style.transform='translate('+(dx/d*k).toFixed(1)+'px,'+(dy/d*k).toFixed(1)+'px)';
  });});});
</script>
</body>
</html>
