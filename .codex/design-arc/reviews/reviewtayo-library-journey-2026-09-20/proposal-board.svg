    <text x="64" y="356" class="label ink">Manage exam workspaces</text>
    <text x="30" y="424" class="body muted">Escape closes and restores focus. Planned exams remain informational.</text>
  </g>

  <g transform="translate(60 615)">
    <rect class="panel" rx="22" width="720" height="395"/>
    <text x="28" y="35" class="tiny brand">03 · EXAM WORKSPACE / DASHBOARD</text>
    <line x1="28" y1="54" x2="692" y2="54" class="line"/>
    <text x="30" y="83" class="h2 brand">reviewtayo</text><text x="175" y="81" class="label muted">← All exams</text>
    <rect x="30" y="101" width="660" height="46" rx="10" fill="#172033"/>
    <text x="48" y="129" class="label white">Civil Service · Professional</text><text x="282" y="129" class="nav white">Overview</text><text x="366" y="129" class="nav white">Practice</text><text x="438" y="129" class="nav white">Mock exams</text><text x="535" y="129" class="nav white">Guides</text><text x="596" y="129" class="nav white">Exam info</text>
    <text x="34" y="190" class="tiny muted">YOUR CIVIL SERVICE WORKSPACE</text>
    <text x="34" y="226" class="h2 ink">Good morning. What will you improve today?</text>
    <rect x="34" y="252" width="286" height="108" rx="14" class="brandbg"/>
    <text x="52" y="278" class="tiny brand">NEXT BEST ACTION</text><text x="52" y="305" class="h2 ink">10-question verbal drill</text><text x="52" y="333" class="label brand">Start practice →</text>
    <rect x="338" y="252" width="160" height="108" rx="14" fill="#fff" stroke="#d9d5cf"/><text x="356" y="280" class="tiny muted">READINESS</text><text x="356" y="316" class="title ink">64%</text><text x="356" y="340" class="body muted">Needs focus</text>
    <rect x="516" y="252" width="174" height="108" rx="14" fill="#fff" stroke="#d9d5cf"/><text x="534" y="280" class="tiny muted">TARGET</text><text x="534" y="309" class="label ink">March 2027</text><text x="534" y="336" class="body muted">176 days left</text>
  </g>

  <g transform="translate(810 615)">
    <rect class="panel" rx="22" width="340" height="395"/>
    <text x="24" y="35" class="tiny brand">04 · NEW LEARNER</text>
    <rect x="24" y="64" width="292" height="292" rx="16" class="brandbg"/>
    <text x="44" y="102" class="tiny brand">BUILD YOUR FIRST WORKSPACE</text>
    <text x="44" y="139" class="h2 ink">Choose one live exam.</text>
    <text x="44" y="169" class="body muted">Your track, target date, and progress</text>
    <text x="44" y="190" class="body muted">stay inside that exam.</text>
    <rect x="44" y="210" width="252" height="76" rx="12" fill="#fff" stroke="#b4586f"/>
    <text x="60" y="236" class="label ink">Civil Service Examination</text><text x="60" y="261" class="body muted">Professional · Subprofessional</text>
    <rect x="44" y="302" width="174" height="42" rx="9" class="brand"/><text x="67" y="328" class="label white">Choose a track →</text>
  </g>

  <g transform="translate(1180 615)">
    <rect class="panel" rx="22" width="360" height="395"/>
    <text x="24" y="35" class="tiny brand">05 · MOBILE 390×844</text>
    <rect x="58" y="58" width="244" height="310" rx="24" fill="#fff" stroke="#172033" stroke-width="3"/>
    <text x="76" y="88" class="label brand">reviewtayo</text><text x="270" y="88" class="label ink">☰</text>
    <text x="76" y="126" class="tiny brand">EXAM REVIEW LIBRARY</text>
    <text x="76" y="158" class="h2 ink">Choose your exam.</text>
    <text x="76" y="184" class="body muted">Start as a guest. Save progress when ready.</text>
    <rect x="76" y="207" width="208" height="82" rx="12" fill="#fff" stroke="#b4586f" stroke-width="2"/>
    <text x="91" y="233" class="label ink">Civil Service</text><text x="91" y="256" class="body muted">Live · 2 tracks</text><text x="91" y="278" class="label brand">Open reviewer →</text>
    <text x="76" y="317" class="tiny muted">PLANNED</text><text x="76" y="343" class="body ink">LET · Nursing · BFP · NAPOLCOM</text>
  </g>

  <g transform="translate(60 1040)">
    <text x="0" y="24" class="tiny brand">MATERIAL SUPPORTING STATES</text>
    <rect x="0" y="44" width="350" height="176" rx="16" class="panel"/><text x="22" y="76" class="label ink">Loading workspace</text><rect x="22" y="96" width="306" height="18" rx="9" fill="#ece8e3"/><rect x="22" y="128" width="210" height="18" rx="9" fill="#ece8e3"/><text x="22" y="190" class="body muted">Stable shell; no layout jump.</text>
    <rect x="385" y="44" width="350" height="176" rx="16" class="panel"/><text x="407" y="76" class="label ink">Planned exam</text><text x="407" y="107" class="body muted">Coverage research in progress.</text><rect x="407" y="129" width="168" height="38" rx="9" fill="#f2f0ed"/><text x="425" y="153" class="label muted">View development status</text><text x="407" y="190" class="body muted">No false “Start” action.</text>
    <rect x="770" y="44" width="350" height="176" rx="16" class="panel"/><text x="792" y="76" class="label ink">Workspace unavailable</text><text x="792" y="107" class="body muted">Your local progress is safe. Try loading again.</text><rect x="792" y="129" width="105" height="38" rx="9" class="brand"/><text x="817" y="153" class="label white">Try again</text><text x="792" y="190" class="body muted">Recoverable error with preserved state.</text>
    <rect x="1155" y="44" width="385" height="176" rx="16" class="panel"/><text x="1177" y="76" class="label ink">Sign in, in context</text><text x="1177" y="107" class="body muted">Save Civil Service · Professional progress.</text><rect x="1177" y="129" width="105" height="38" rx="9" class="brand"/><text x="1202" y="153" class="label white">Sign in</text><text x="1298" y="153" class="label muted">Continue as guest</text><text x="1177" y="190" class="body muted">Never blocks first practice.</text>
  </g>
