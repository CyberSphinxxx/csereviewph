<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300">
  <defs>
    <style>
      .bg{fill:#f7f5f1}.panel{fill:#fff;stroke:#d9d5cf;stroke-width:2}.ink{fill:#172033}.muted{fill:#667085}.brand{fill:#9f1736}.brandbg{fill:#f8ecef}.green{fill:#087f5b}.greenbg{fill:#e8f7f1}.line{stroke:#e7e2dc;stroke-width:2}.nav{font:600 14px Arial,sans-serif}.tiny{font:700 11px Arial,sans-serif;letter-spacing:1.4px}.body{font:400 14px Arial,sans-serif}.label{font:700 13px Arial,sans-serif}.title{font:800 28px Arial,sans-serif}.h2{font:800 20px Arial,sans-serif}.num{font:800 16px Arial,sans-serif}.white{fill:#fff}.dash{stroke:#c8c1b8;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1300"/>
  <text x="60" y="58" class="title ink">ReviewTayo — Library → Exam workspace</text>
  <text x="60" y="84" class="body muted">Codex visual proposal · desktop 1440×900 + mobile 390×844 · platform asset set: existing logo only</text>

  <g transform="translate(60 115)">
    <rect class="panel" rx="22" width="960" height="470"/>
    <text x="28" y="35" class="tiny brand">01 · PUBLIC LIBRARY / DESKTOP</text>
    <line x1="28" y1="54" x2="932" y2="54" class="line"/>
    <text x="32" y="87" class="h2 brand">reviewtayo</text>
    <text x="460" y="84" class="nav ink">Exams</text><text x="532" y="84" class="nav muted">How it works</text><text x="635" y="84" class="nav muted">Study resources</text>
    <rect x="828" y="65" width="92" height="34" rx="9" fill="#fff" stroke="#c8c1b8"/><text x="850" y="87" class="nav ink">Sign in</text>
    <text x="36" y="145" class="tiny brand">PHILIPPINE EXAM REVIEW LIBRARY</text>
    <text x="36" y="188" class="title ink">Choose the exam you’re preparing for.</text>
    <text x="36" y="217" class="body muted">Original practice, mock exams, and progress tools—organized around one target exam.</text>
    <rect x="36" y="246" width="158" height="44" rx="10" class="brand"/><text x="68" y="273" class="label white">Explore exams ↓</text>
    <text x="210" y="273" class="label muted">No account needed to begin</text>
    <line x1="36" y1="318" x2="924" y2="318" class="line"/>
    <text x="36" y="348" class="tiny muted">AVAILABLE NOW</text>
    <rect x="36" y="365" width="418" height="78" rx="12" fill="#fff" stroke="#b4586f" stroke-width="2"/>
    <rect x="52" y="382" width="45" height="44" rx="10" class="brandbg"/><text x="61" y="409" class="label brand">CSE</text>
    <text x="112" y="391" class="label ink">Civil Service Examination</text><text x="112" y="413" class="body muted">Professional · Subprofessional</text>
    <text x="112" y="434" class="label brand">Open reviewer →</text>
    <text x="498" y="348" class="tiny muted">IN DEVELOPMENT</text>
    <text x="498" y="386" class="label ink">LET</text><text x="552" y="386" class="label ink">Nursing</text><text x="638" y="386" class="label ink">BFP</text><text x="700" y="386" class="label ink">NAPOLCOM</text>
    <text x="498" y="414" class="body muted">See coverage and development status—no dead start buttons.</text>
  </g>

  <g transform="translate(1050 115)">
    <rect class="panel" rx="22" width="490" height="470"/>
    <text x="28" y="35" class="tiny brand">02 · EXAM SELECTOR OPEN</text>
    <rect x="30" y="67" width="430" height="54" rx="12" fill="#fff" stroke="#b4586f" stroke-width="2"/>
    <text x="48" y="90" class="tiny muted">CURRENT EXAM</text><text x="48" y="111" class="label ink">Civil Service · Professional</text><text x="430" y="100" class="label brand">⌃</text>
    <rect x="30" y="130" width="430" height="258" rx="14" fill="#fff" stroke="#d9d5cf" stroke-width="2"/>
    <text x="50" y="162" class="tiny muted">YOUR EXAMS</text>
    <rect x="48" y="176" width="394" height="72" rx="10" class="brandbg"/>
    <text x="64" y="200" class="label ink">Civil Service Examination</text><text x="64" y="224" class="body muted">Professional · Active workspace</text><text x="412" y="214" class="green">●</text>
    <line x1="48" y1="266" x2="442" y2="266" class="line"/>
